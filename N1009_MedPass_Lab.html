 'use strict';
 // Only explicit patient-name confirmations should reach the mismatch log.
 // Requiring a plausible personal name avoids confusing assessments ("are you dizzy?")
 // with an identification check.
 const identityIntent=(raw,medications=[])=>{
   const phrase=String(raw||'').trim().match(/^(are you|you are|your name is|is your name|am i speaking (?:to|with))\s+(.+?)\s*[?!]*$/i);
   if(!phrase)return null;
   const lead=phrase[1].toLowerCase();
   const candidate=phrase[2].trim().replace(/[.?!]+$/,'').trim();
   const normalized=candidate.toLowerCase().replace(/\s+/g,' ');
   if(normalized==='practice patient')return 'name';
   // Title case alone is not evidence of a person's name. Exclude clinical
   // verbs, symptoms, drug names and the medications known to this scenario.
   // Exclude assessment language, not hand-maintained medication names. The caller
   // supplies the medication vocabulary generated from current cases and references.
   const clinicalWords=/\b(?:having|feeling|taking|using|receiving|getting|experiencing|allergic|dizzy|dizziness|lightheaded|pain|medicine|medication|medicines|medications|blood|thinner|side|effects|breathing|standing|hungry|thirsty|sleepy|awake|confused|nauseated|allergies|hurt|sick|better|okay|fine)\b/i;
   const caseDrugWord=medications.some(m=>{
     const words=String(typeof m==='string'?m:m.name||'').toLowerCase().match(/[a-z]{4,}/g)||[];
     return words.some(w=>new RegExp('\\b'+w+'\\b','i').test(candidate));
   });
   if(clinicalWords.test(candidate)||caseDrugWord)return null;
   const honorific=/^(?:mr|mrs|ms|miss|dr)\.?\s+[a-z][a-z'-]+(?:\s+[a-z][a-z'-]+)?$/i.test(candidate);
   const capitalizedName=/^[A-Z][a-z'-]+(?:\s+[A-Z][a-z'-]+){1,2}$/.test(candidate);
   const explicitName=(lead==='your name is'||lead==='is your name') &&
     /^[a-z][a-z'-]+(?:\s+[a-z][a-z'-]+){1,2}$/i.test(candidate) &&
     !/\b(?:having|feeling|allergic|taking|in|on|pain|dizzy|tired|sleepy|okay|fine|better|sick|breathing|going|doing|getting|experiencing|need|needing|hungry|thirsty)\b/i.test(candidate);
   return honorific||capitalizedName||explicitName?'wrongName':null;

   const symptomatic=/\b(?:dizzy|dizziness|lightheaded|vertigo)\b/i.test(String(assessment||''))||prior==='Yes';

   const names=(Array.isArray(medications)?medications:[]).map(m=>typeof m==='string'?m:m.name||'').filter(Boolean);

   }
   const ordered=names.find(name=>aliases(name).some(mentions));
   const referenced=Object.keys(references).find(name=>aliases(name).some(mentions));
   if(ordered)return `${ordered} is listed as an order due in this practice case. I am not sure about my full home medication list. Please verify it before giving any medication.`;
   if(referenced)return `I cannot confirm whether I take ${referenced} at home. Please check my medication history; the orders due now are not a complete medication list.`;

     if(/(adverse|side effect|contraindic|risk|precaution)/.test(text))return 'adverse';
     if(/(syringe|dose|volume|how much|units|calculation|mg\/ml)/.test(text))return 'dose';

   if(/\b(?:i am|i'm|we are)\s+(?:going to )?(?:give|giving|administer|administering)\b|\b(?:this medication|this medicine) (?:will|is used|helps|treats)\b/.test(text))return 'teach';

   if(/(your|tell me|state|confirm|what is|what's|full|say).{0,35}(name)|\bwho are you\b|\bname and (?:date of birth|dob)\b/.test(text))return 'name';
   if(/(date of birth|birth date|birthday|\bdob\b|when were you born)/.test(text))return 'dob';
   if(/(allerg|reaction to medicine|any medications you can't take)/.test(text))return 'allergies';
   const currentDrug=medications.some(m=>{
     const tokens=String(typeof m==='string'?m:m.name||'').toLowerCase().match(/[a-z]{4,}/g)||[];
     return tokens.some(token=>new RegExp('\\b'+token+'\\b').test(text));
   });
   if(/\b(?:blood\s*thinners?|anticoagulants?|antiplatelets?|medication history|medication list|home medications?|home meds|what (?:medications?|medicines?|meds) do you|which (?:medications?|medicines?|meds)|what (?:medications?|medicines?|meds) are you|(?:taking|take|on|prescribed|receiving|using)\s+(?:(?:any|some)\s+)?(?:other\s+)?(?:medications?|medicines?|meds))\b/.test(text)
     || currentDrug)return 'medications';
   if(/(swallow|chok|difficulty.*(pill|eat|drink)|trouble.*(pill|eat|drink))/.test(text))return 'swallow';
   if(/(one at a time|all together|pill.*pref|take.*(pills|tablets|capsules)|pills.*together)/.test(text))return 'oralChoice';
   if(/(where.*(injection|shot)|prefer.*(site|shot|injection)|which.*(arm|leg|abdomen|site)|injection site)/.test(text))return 'preference';
   if(/(how.*pain|pain (?:score|level)|rate.*pain|how.*hurt|pain.*(better|worse)|pain.*\b10\b|\b(?:any|have|having|in|much|experiencing|feel|feeling)\s+pain\b|\bdoes (?:it|that) hurt\b)/.test(text))return 'pain';
   if(/(\bdizz(?:y|iness)\b|\blightheaded\b|\bvertigo\b)/.test(text))return 'dizziness';
   if(/(alert|sleepy|drowsy|awake|how.*feeling|feel okay|feel now)/.test(text))return 'feel';
   if(/(water|drink|thirst|dry mouth)/.test(text))return 'water';
   if(/(side effect|adverse|dizz|nausea|bleed|sleepy|constipat|diarrhea|rash)/.test(text))return 'effects';
   if(/(explain|i am giving|this medication|this medicine|\bmedication\b|\bmedicine\b|the purpose|what.*for)/.test(text))return 'teach';
   if(/(bracelet|wristband|armband|identity band|id band)/.test(text))return 'band';
   if(/(hello|hi |good morning|good afternoon|i'm your|i am your|my name is)/.test(text))return 'introduce';

function patientCard(s){
 const v=s.patientState;
 const field=(label,value)=>`<div class="vital"><span>${esc(label)}</span><b>${esc(value===null||value===undefined?'Not assessed':value)}</b></div>`;
 return `<section class="statusCard" aria-label="Simulated patient assessment status"><div class="row between"><div class="sectionLabel" style="margin:0">Bedside observations</div><span class="pill">${v.reassessed?'Reassessed':v.revealed?'Updated':'Pending'}</span></div><div class="vitalGrid">${field('BP',v.bp)}${field('HR',v.hr===null?null:v.hr+' bpm')}${field('RR',v.rr===null?null:v.rr+'/min')}${field('SpO₂',v.spo2===null?null:v.spo2+'%')}${field('Pain',v.pain)}${field('Alertness',v.alertness)}${v.dizziness!==null?field('Dizziness',v.dizziness):''}${v.glucose!==null?field('Glucose',v.glucose+' mg/dL'):''}</div><div class="meta" style="margin-top:9px">${esc(v.note||'Ask the instructor for observations. No vital signs are assumed.')}</div></section>`;

function updateVitals(s,m){
 const v=s.patientState;
 const t=assessments[m.name]?.[isRisk(s,m)?1:0]||'';
 const match=(rx)=>{const r=t.match(rx);return r?r[1]:null};
 v.revealed=true;
 const bp=match(/\bBP\s*(\d+\s*\/\s*\d+)/i);if(bp)v.bp=bp.replace(/\s/g,'');
 const hr=match(/(?:apical pulse|\bHR\b|pulse)\s*(\d+)/i);if(hr)v.hr=Number(hr);
 const rr=match(/\bRR\s*(\d+)/i);if(rr)v.rr=Number(rr);
 const spo2=match(/\bSpO2\s*(\d+)/i);if(spo2)v.spo2=Number(spo2);
 const pain=match(/\bPain\s*(\d+\s*\/\s*10)/i);if(pain)v.pain=pain;
 const glucose=match(/\bGlucose\s*(\d+)/i);if(glucose)v.glucose=Number(glucose);
 // The patient's stated symptom and proctor findings share one case state.
 if(/\b(?:dizzy|dizziness|lightheaded|vertigo)\b/i.test(t))v.dizziness='Yes';
 if(/difficult to arouse/i.test(t))v.alertness='Difficult to arouse';else if(/awake|alert/i.test(t))v.alertness='Awake';
 if(!v.alertness||v.alertness==='Not assessed')v.alertness='Not reported';
 v.note='Instructor observations for '+m.name+'. Values are fictional and only disclosed when assessed.';
 log(s,'Patient status updated from proctor assessment',m.name+' | '+t);
}
function reassessPatient(){

 v.note='SIMULATED reassessment after analgesia: continue monitoring sedation and breathing.';

}

function rightsUI(st,p){return `<div class="groupTitle">The 6 rights · independent verification</div><div class="actionsGrid">${RIGHTS.map(r=>`<button class="choice ${done(st,p+'_'+r.toLowerCase())?'done':''}" data-act="step" data-id="${p}_${r.toLowerCase()}">${r}${done(st,p+'_'+r.toLowerCase())?'<span class="check">✓</span>':''}</button>`).join('')}</div><p class="fineprint">Verify against the MAR, label, patient, order, and intended documentation. Tapping a right records your verbal confirmation.</p>`}
function stepBtn(st,id,label,sub=''){let yes=st.has?st.has(id):done(st,id);return `<button class="choice ${yes?'done':''}" data-act="step" data-id="${id}">${label}${sub?`<span style="display:block;font-size:11px;color:#9ab7c2">${sub}</span>`:''}${yes?'<span class="check">✓</span>':''}</button>`}
function nav(){return `<header class="masthead"><div class="brand"><span class="brandMark">✚</span><span>MedPass <span style="color:var(--teal)">Lab</span></span></div><div class="headRight">${current.session&&!current.session.ended?`<div><div class="timerIcon">TIME REMAINING</div><div class="timer" data-timer>${clock()}</div></div><span class="stageTag">CHECK ${current.session.stage}/3</span><button class="btn small ghost" data-act="end">End</button>`:'<span class="tagline">N1009 · Skill simulation</span>'}</div></header>`}
function tabs(){let x=[['workspace','Simulation'],['library','Drug reference'],['about','Instructions']];return `<div class="subnav">${x.map(([id,t])=>`<button class="nav ${current.tab===id?'active':''}" data-act="tab" data-id="${id}">${t}</button>`).join('')}</div>`}
function home(){const c=getCase(current.caseKey),selected=c.case;return `<div class="homeHero"><div><div class="eyebrow">Clinical judgment · medication safety</div><h1>Practice the pass.<br><span style="color:var(--teal)">Own the checkoff.</span></h1><p class="lead">A complete three check medication administration simulator. Prep at the cart, answer the instructor, speak with the patient, perform bedside assessments and finish with an S/U report.</p><div class="row wrap" style="margin-top:25px"><span class="chip">✓ 20 uploaded eMAR cases</span><span class="chip">✓ 12 drug references</span><span class="chip">✓ PO, SC and IM</span></div></div><div class="panel previewPatient"><div class="avatar" aria-label="Illustrated practice patient">${portrait('patient')}</div><span class="chip">Practice Patient · Sim Bed 1</span></div></div><div class="panel setupCard"><h2>Set up a checkoff</h2><div class="grid2"><div class="field"><label for="case">Scenario</label><select id="case" data-input="case">${CATALOG.map(c=>`<option value="${c.key}" ${c.key===current.caseKey?'selected':''}>${esc(c.label)}</option>`).join('')}</select></div><div class="field"><label>Activity</label><div class="infoTile"><div class="kicker">${c.kind==='uploaded'?'Simulated case adapted from course exercises':'Practice case built for this app'}</div><b>${selected.meds.length} medication${selected.meds.length===1?'':'s'}</b><div class="smallText muted">${selected.meds.map(m=>m.name).join(' · ')}</div></div></div></div><div class="grid2"><div><label class="optLabel"><input type="radio" name="mode" data-input="mode" value="practice" ${current.mode==='practice'?'checked':''}><span><b>Coached practice</b><br><span class="muted smallText">Hints and corrective prompts are visible.</span></span></label><label class="optLabel"><input type="radio" name="mode" data-input="mode" value="checkoff" ${current.mode==='checkoff'?'checked':''}><span><b>Checkoff attempt</b><br><span class="muted smallText">Fewer hints. Same 30 minute timer.</span></span></label></div><div><label class="optLabel"><input type="checkbox" data-input="challenge" ${current.challenge?'checked':''}><span><b>Safety challenge</b><br><span class="muted smallText">Instructor gives concerning findings. Recognize when to hold.</span></span></label><div class="alertLine">All names, vitals, dates of birth, insulin doses, and synthetic drills are fictional learning data. No actual medications should be administered from this app. Publication permission for adapted course content was confirmed by the app requester with their instructor and college.</div></div></div><div class="actionfooter"><button class="btn primary" data-act="start">Begin 30 minute checkoff →</button></div></div>`}
function sidebar(s){const active=me(s,s.active);return `<aside class="panel sidebar"><div class="sectionLabel">eMAR · ${esc(getCase(s.caseKey).label)}</div><div class="patientLine"><div class="avatar">${portrait('patient')}</div><div><div class="name">Practice Patient</div><div class="meta">Sim Bed 1 · 76 yrs · NKDA</div></div></div><div class="meta" style="margin-top:11px">Synthetic training DOB: 01/01/1950<br><span style="color:#bcf0e2">No real patient identity is used</span></div><div class="divider"></div><div class="sectionLabel">Orders due now</div><div class="medList">${s.c.meds.map(m=>{let st=me(s,m.id),progress=(st.status==='given'||st.status==='held')?'complete':s.stage===1?prepComplete(s,m)?'ready':'pending':s.stage===2?quizComplete(s,m)?'ready':'pending':'pending';return `<div class="marDrug ${m.id===s.active?'selected':''}" role="button" tabindex="0" data-act="selectMed" data-id="${m.id}"><div class="drugTop"><span class="drugTitle">${esc(m.name)}</span><span class="pill ${st.status==='given'||st.status==='held'?'ok':''}">${st.status==='given'?'Given':st.status==='held'?'Held':progress==='ready'?'Ready':'Due'}</span></div><div class="drugDetail">${esc(m.order)}<br>${esc(m.strength||'Strength not entered')} · ${esc(m.route)}</div><div class="pips"><i class="pip ${prepComplete(s,m)?'done':''}"></i><i class="pip ${quizComplete(s,m)?'done':''}"></i><i class="pip ${st.status!=='pending'?'done':''}"></i></div></div>`}).join('')}</div><p class="fineprint">Original eMAR names are sometimes abbreviated or misspelled. Display names here are normalized; source wording is preserved in the data file.</p></aside>`}
function medReference(m){let r=REF[m.name]||{},s=current.session;return `<div class="groupTitle">Medication card · ${esc(m.name)}</div><div class="grid2"><div class="infoTile"><div class="kicker">Class</div><b>${esc(r.cl||'Not supplied in 12 drug reference')}</b><div class="smallText muted">Trade: ${esc(r.trade||'Verify packaging')}</div></div><div class="infoTile"><div class="kicker">Clinical checks</div><div class="smallText" style="line-height:1.7">${esc(r.assess||'Verify exact order and drug information')}</div></div></div>${s.mode==='practice'?`<div class="sourceNote" style="margin-top:9px">${esc(r.why||'Review indication')} · Risk: ${esc(r.adverse||'Check references')}</div>`:''}`}
function prepNextAction(s,m){
 const st=me(s,m.id);
 if(!s.global.has('hygiene1'))return 'Wash hands at the start of the first check.';
 if(!s.global.has('marAllergies'))return 'Locate the MAR and review allergies.';
 if(!st.done.has('gather'))return 'Select Gather the ordered product.';
 if(!st.done.has('expiry'))return 'Read the label and expiration date.';
 const missing=RIGHTS.filter(r=>!st.done.has('r1_'+r.toLowerCase()));
 if(missing.length)return 'Complete the first six rights before drawing: '+missing.join(', ')+'.';
 if(!st.syringe)return 'Choose a syringe in the injection workbench.';
 if(!st.done.has('chooseSyringe'))return 'Select Confirm selected syringe.';
 if(m.name==='NPH insulin U100'&&!st.clarified)return 'Request instructor clarification of the incomplete NPH order.';
 if(m.name==='NPH insulin U100'&&!st.done.has('rollNPH'))return 'Mark Gently roll NPH vial.';
 if(!st.done.has('vialClean'))return 'Select Clean vial top for 15 seconds.';
 if(!st.done.has('injectAir'))return 'Enter the air volume in mL, then select Inject equal volume of air. The air amount is not a number of medication units.';
 if(!st.done.has('withdraw'))return 'Enter the measured dose using the unit shown above the field, then select Withdraw entered amount.';
 if(!st.done.has('clearBubbles'))return 'Select Clear air bubbles.';
 if(!st.done.has('sterile'))return 'Complete the needle safety or sterile technique step.';
 if(!st.done.has('labelWritten'))return 'Enter your initials and student credentials, then select Fill syringe label.';
 if(!st.done.has('labelAttached'))return 'Affix the label without obstructing syringe markings.';
 return 'Injection preparation is complete for this medication. Prepare the remaining orders.';
}
// Guided injection preparation: one actionable task at a time.
// The original checklist remains available as an optional overview. Both views
// call clickStep(), so there is only one source of truth for validation/scoring.
function guidedPrepTasks(s,m){
 const global=(id,title,detail)=>({id,title,detail,group:0,shared:true});
 const local=(id,title,detail,group)=>({id,title,detail,group,shared:false});
 const tasks=[
  global('uniform','Confirm correct uniform','Check the uniform requirement for this simulation.'),
  global('peers','Confirm peer signoffs','Verify the peer signoffs required by your program.'),
  global('hygiene1','Perform hand hygiene','Wash hands before handling medication supplies.'),
  global('marAllergies','Read the eMAR and allergies','Review the order and confirm the listed allergy status.'),
  local('gather','Gather the correct medication','Compare the product to the eMAR order.',1),
  local('expiry','Check the medication label and expiry','Read the actual package. The digital expiration shown is fictional.',1),
  ...RIGHTS.map(right=>local('r1_'+right.toLowerCase(),'Verify right '+right.toLowerCase(), 'State and confirm this right against the patient record, order, label and intended administration.',1)),
  local('chooseSyringe','Choose and confirm your syringe','Select the syringe suited to the product concentration and ordered dose.',2)
 ];
 if(m.name==='NPH insulin U100')tasks.push(local('clarify','Clarify the incomplete NPH order','The supplied order does not give an actual NPH dose. Ask the instructor before drawing.',2),local('rollNPH','Gently roll the NPH vial','Resuspend the insulin per the training checklist and product instructions.',2));
 tasks.push(
  local('labelWritten','Prepare the syringe label','Enter the planned dose, your initials and student credentials before filling the syringe.',2),
  local('vialClean','Clean the vial top','Use an alcohol wipe and follow the checklist cleansing step.',3),
  local('injectAir','Inject the matching volume of air','Enter air in mL, based on the volume you plan to withdraw. This is not the medication unit count.',3),
  local('withdraw','Withdraw the measured dose','Confirm the actual amount in the correct unit. The app checks it against the selected product.',3),
  local('clearBubbles','Remove air bubbles','Check the syringe graduations again after removing bubbles.',4),
  local('sterile',medIM(m)?'Change to the injection needle aseptically':'Maintain sterility and handle needle safely','Maintain aseptic technique. Follow your skills checklist for the needle setup.',4),
  local('labelAttached','Attach the label without hiding markings','Keep the graduated measurement lines visible.',4)
 );
 return tasks;
}
function guidedDone(s,m,t){const st=me(s,m.id);return t.id==='clarify'?st.clarified:t.shared?s.global.has(t.id):st.done.has(t.id)}
function guidedPrepFields(s,m,t,exp){const st=me(s,m.id);
 const number=(name,title,val,hint)=>`<div class="field"><label for="guided-${name}">${esc(title)}</label><input id="guided-${name}" class="input" type="number" step="any" min="0" inputmode="decimal" data-input="${name}" value="${esc(val??'')}" placeholder="${esc(hint)}"></div>`;
 if(t.id==='chooseSyringe')return `<div class="field"><label for="guided-syringe">Syringe type</label><select id="guided-syringe" data-input="syringe"><option value="">Select syringe type</option><option value="insulin" ${st.syringe==='insulin'?'selected':''}>U100 insulin syringe</option><option value="tuberculin" ${st.syringe==='tuberculin'?'selected':''}>1 mL tuberculin syringe</option><option value="3mL" ${st.syringe==='3mL'?'selected':''}>3 mL syringe</option><option value="5mL" ${st.syringe==='5mL'?'selected':''}>5 mL syringe</option></select></div>${medIM(m)?`<div class="field"><label for="guided-needle">Needle length (training model)</label><select id="guided-needle" data-input="needle"><option value="">Select length</option>${['5/8 inch','1 inch','1.5 inch'].map(x=>`<option value="${x}" ${st.needle===x?'selected':''}>${x}</option>`).join('')}</select><p class="fineprint">Needle length depends on patient and site. Follow program policy.</p></div>`:''}${s.mode==='practice'?`<p class="guidedHint">Practice hint: ${esc(anticipatedSyringe(m,s))} syringe for this case.</p>`:''}`;
 if(t.id==='labelWritten')return `<div class="grid2">${number('amount','Planned draw amount ('+exp.unit+')',st.amount,'Enter planned amount')}<div class="field"><label>Medication order</label><div class="guidedReadout">${esc(m.order)}<br>${esc(m.strength)}</div></div></div><div class="grid2"><div class="field"><label for="guided-initials">Your initials</label><input id="guided-initials" class="input" data-input="initials" maxlength="8" placeholder="Example: TB" value="${esc(s.initials||'')}"></div><div class="field"><label for="guided-credentials">Student credentials</label><input id="guided-credentials" class="input" data-input="credentials" maxlength="12" placeholder="Example: SN" value="${esc(s.credentials||'')}"></div></div>${s.mode==='practice'?`<p class="guidedHint">Dose math: ${esc(exp.label)}</p>`:''}`;
 if(t.id==='injectAir')return `${number('air','Air volume to inject (mL)',st.air,'Example: 0.2')}<p class="guidedHint">The air volume is measured in mL, not units. Calculate from the vial concentration and ordered dose.</p>`;
 if(t.id==='withdraw')return `${number('amount','Measured medication amount ('+exp.unit+')',st.amount,'Enter measured dose')}<div class="guidedReadout">Order: ${esc(m.order)}<br>Vial: ${esc(m.strength)}</div>${s.mode==='practice'?`<p class="guidedHint">Calculation: ${esc(exp.label)}</p>`:''}`;
 if(t.id==='clarify')return '<p class="alertLine">Do not invent an insulin dose when the order does not specify units or a valid scale. Ask the simulated instructor to clarify.</p>';
 if(t.id==='labelAttached'&&st.done.has('labelWritten')){
  const label=['Date: '+new Date().toLocaleDateString()+' | 24h: '+new Date().toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit'}),
    'Practice Patient | 01/01/1950',m.name+' | '+m.strength,'Ordered: '+m.order,
    'Drawn: '+st.amount+' '+exp.unit,'Expiration: 12/2028 (fictional)','Initials / credentials: '+s.initials+', '+s.credentials].join('\n');
  return `<div class="labelPreview">${esc(label)}</div>`;
 }
 return '';
}
function guidedPrepScreen(s,m){const st=me(s,m.id),exp=expected(m,s),tasks=guidedPrepTasks(s,m),finished=tasks.filter(t=>guidedDone(s,m,t)),pending=tasks.filter(t=>!guidedDone(s,m,t)),task=pending[0],phases=['Get ready','Verify the order','Equipment and label','Prepare and draw','Finish safely'],phaseCounts=phases.map((name,i)=>({name,completed:tasks.filter(t=>t.group===i&&guidedDone(s,m,t)).length,total:tasks.filter(t=>t.group===i).length})),ready=prepComplete(s,m),remaining=all(s).find(x=>!prepComplete(s,x));
 const control=task?.id==='clarify'?`<button class="btn primary guidedPrimary" data-act="clarify">Ask instructor to clarify order</button>`:task?`<button class="btn primary guidedPrimary" data-act="step" data-id="${task.id}">Mark step complete <span aria-hidden="true">→</span></button>`:'';
 return `<div class="screenTitle">01 · Independent prep</div><p class="muted smallText">One step at a time. All actions use the same checkoff safety rules.</p><div class="prepModeRow"><span class="chip">${esc(m.name)} · ${esc(m.route)}</span><button class="btn ghost small" data-act="prepView" data-value="all">View full checklist</button></div><div class="guidedOrder"><div class="kicker">Current eMAR order</div><strong>${esc(m.name)}</strong><p>${esc(m.order)}<br>${esc(m.strength)}</p></div><div class="guidedProgress" aria-label="Preparation progress: ${finished.length} of ${tasks.length} actions completed"><div class="row between"><b>${ready?'Preparation complete':`Step ${finished.length+1} of ${tasks.length}`}</b><span>${finished.length} of ${tasks.length} completed</span></div><div class="progress"><div class="progressFill" style="width:${Math.round(100*finished.length/tasks.length)}%"></div></div><div class="guidedPhases">${phaseCounts.map((v,i)=>`<span class="guidedPhase ${v.completed===v.total?'completed':task?.group===i?'current':''}">${v.completed===v.total?'✓':i+1} ${esc(v.name)}</span>`).join('')}</div></div>${task?`<section class="guidedCurrent" id="guided-current-step" aria-labelledby="guided-task-title" tabindex="-1"><div class="kicker">Current action · ${esc(phases[task.group])}</div><h3 id="guided-task-title">${esc(task.title)}</h3><p class="guidedDescription">${esc(task.detail)}</p>${guidedPrepFields(s,m,task,exp)}<div class="guidedButtons">${control}</div>${current.notice?`<div class="prepFeedback" role="alert">${esc(current.notice)}</div>`:''}</section>`:`<section class="guidedCurrent doneState" id="guided-current-step" tabindex="-1"><div class="kicker">All preparation actions completed</div><h3>${esc(m.name)} is ready for instructor verification</h3><p>Keep the prepared medication with the eMAR. Check the remaining ordered medications before leaving the medication room.</p>${remaining?`<button class="btn primary guidedPrimary" data-act="nextMed">Prepare next medication: ${esc(remaining.name)} →</button>`:`<button class="btn primary guidedPrimary" data-act="nextStage">Continue to instructor check →</button>`}</section>`}<details class="guidedHistory"><summary>Review completed preparation steps (${finished.length})</summary><ol>${finished.map(t=>`<li>✓ ${esc(t.title)}</li>`).join('')||'<li>No actions recorded yet</li>'}</ol></details><p class="fineprint">This digital sequence follows the school skill checklist for practice. Follow your instructor and actual vial specific instructions in a real checkoff. A tap records a simulated action; it does not perform one.</p>`;
}
function prepScreen(s,m){const st=me(s,m.id),exp=expected(m,s),inj=medIsInj(m);if(inj&&s.prepLayout!=='all')return guidedPrepScreen(s,m);return `<div class="screenTitle">01 · Independent prep</div><p class="muted smallText">Medication room. Prepare every ordered medication before presenting to the instructor.</p>${inj?`<div class="prepModeRow"><span class="chip">Complete checklist view</span><button class="btn ghost small" data-act="prepView" data-value="guided">Use guided preparation</button></div>`:''}<div class="groupTitle">Required at the start</div><div class="actionsGrid">${stepBtn(s.global,'uniform','Correct uniform')}${stepBtn(s.global,'peers','Peer signoffs confirmed')}${stepBtn(s.global,'hygiene1','Wash hands thoroughly')}${stepBtn(s.global,'marAllergies','Locate MAR; check NKDA')}</div><div class="groupTitle">${esc(m.name)} · package verification</div><div class="actionsGrid">${stepBtn(st.done,'gather','Gather the ordered product')}${stepBtn(st.done,'expiry','Read label and expiry date')}${!inj?stepBtn(st.done,'keepPackaged','Keep oral drug packaged'):''}</div>${!inj?`<div class="grid2"><div class="field"><label>Number of tablets/capsules to give</label><input class="input" type="number" step="any" min="0" data-input="amount" value="${esc(st.amount)}" placeholder="Calculate from order"></div><div class="field"><label>Calculation</label><div class="infoTile smallText">${s.mode==='practice'?esc(exp.label):'Enter dose count using ordered amount and label strength.'}</div></div></div><div class="actionsGrid">${stepBtn(st.done,'oralCount','Check tablet count vs MAR')}</div>`:''}${rightsUI(st,'r1')}${inj?`<div class="groupTitle">Injection workbench</div><div class="prepHelp" role="status"><strong>Next required action</strong><span>${esc(prepNextAction(s,m))}</span></div><div class="grid2"><div class="field"><label>Syringe selection</label><select data-input="syringe"><option value="">Choose syringe</option><option value="insulin" ${st.syringe==='insulin'?'selected':''}>U100 insulin syringe</option><option value="tuberculin" ${st.syringe==='tuberculin'?'selected':''}>1 mL tuberculin syringe</option><option value="3mL" ${st.syringe==='3mL'?'selected':''}>3 mL syringe</option><option value="5mL" ${st.syringe==='5mL'?'selected':''}>5 mL syringe</option></select></div><div class="field"><label>Draw up amount (${exp.unit})</label><input class="input" type="number" step="any" min="0" data-input="amount" value="${esc(st.amount)}" placeholder="Enter measured dose"></div></div>${medIM(m)?`<div class="field"><label>IM needle length (fictional average adult training model)</label><select data-input="needle"><option value="">Choose needle length</option>${['5/8 inch','1 inch','1.5 inch'].map(x=>`<option ${st.needle===x?'selected':''}>${x}</option>`).join('')}</select><div class="fineprint">Appropriate length varies by patient, site, and clinical policy. This scenario accepts 1 or 1.5 inches and flags 5/8 inch as unsuitable for this training model.</div></div>`:''}${s.mode==='practice'?`<div class="alertLine">Dose math hint: ${esc(exp.label)}. ${esc('Use '+anticipatedSyringe(m,s)+' syringe for this practice setup.')}</div>`:''}${m.name==='NPH insulin U100'&&!st.clarified?`<div class="alertLine bad">Uploaded NPH eMAR says “Per Sliding Scale” but gives no scale or units. Ask the instructor to clarify this incomplete order before drawing medication.</div><button class="btn warn" data-act="clarify">Request NPH order clarification</button>`:''}<div class="field"><label>Air to inject (mL)</label><input class="input" data-input="air" type="number" min="0" step="any" value="${esc(st.air||'')}" placeholder="Match withdrawn volume"></div><div class="grid2"><div class="field"><label>Your initials</label><input class="input" data-input="initials" maxlength="8" placeholder="e.g. TB" value="${esc(s.initials||'')}"></div><div class="field"><label>Credentials on label</label><input class="input" data-input="credentials" maxlength="12" placeholder="e.g. SN" value="${esc(s.credentials||'')}"></div></div><div class="fineprint">Fictional vial label for digital practice: expiration 12/2028. The supplied eMAR leaves expiration blank; check real product packaging at your lab.</div>${st.done.has('labelWritten')?`<div class="labelPreview">${esc('Date: '+new Date().toLocaleDateString()+' | 24h: '+new Date().toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit'})+'\nPractice Patient | 01/01/1950\n'+m.name+' | '+m.strength+'\nOrdered: '+m.order+'\nDrawn: '+st.amount+' '+exp.unit+'\nExpiry: 12/2028 (fictional)\nInitials / credential: '+(s.initials||'NONE')+', '+(s.credentials||'NONE'))}</div>`:''}<div class="actionsGrid" style="margin-top:13px">${stepBtn(st.done,'chooseSyringe','Confirm selected syringe')}${stepBtn(st.done,'labelWritten','Fill syringe label')}${m.name==='NPH insulin U100'?stepBtn(st.done,'rollNPH','Gently roll NPH vial'):''}${stepBtn(st.done,'vialClean','Clean vial top for 15 seconds')}${stepBtn(st.done,'injectAir','Inject equal volume of air')}${stepBtn(st.done,'withdraw','Withdraw entered amount')}${stepBtn(st.done,'clearBubbles','Clear air bubbles')}${stepBtn(st.done,'sterile',medIM(m)?'Change to injection needle aseptically':'Maintain sterility / safe recap')}${stepBtn(st.done,'labelAttached','Affix label away from graduations')}</div>${current.notice?`<div class="prepFeedback" role="alert">${esc(current.notice)}</div>`:''}`:''}<div class="actionfooter"><button class="btn primary" data-act="nextStage">Continue to instructor check →</button></div>`}
function instructorScreen(s,m){const st=me(s,m.id),r=REF[m.name],q=r?.q;return `<div class="screenTitle">02 · Instructor check</div><p class="muted smallText">Verbalize the second verification, review the pharmacology, and prepare to enter the patient room.</p>${rightsUI(st,'r2')}<div class="groupTitle">Question from the proctor</div><div class="bubble instructor"><b>Instructor</b>${esc(q?q[0]:'Which assessment is important before this medication?')}</div>${!st.quiz?`<div>${(q?q[1]:['Verify the prescription and applicable assessment','Give without assessment','Ignore the MAR']).map((x,i)=>`<button class="quizOpt" data-act="answerQuiz" data-index="${i}">${esc(x)}</button>`).join('')}</div>`:`<span class="chip">✓ Correct answer verified${st.quizAttempts>1?' after '+st.quizAttempts+' tries':''}</span>`}<div class="groupTitle">Reference sheet</div>${medReference(m)}<div class="groupTitle">Instructor transition</div>${stepBtn(s.global,'hygiene2','Wash hands before leaving med room')}<div class="actionfooter"><button class="btn primary" data-act="nextStage">Continue to bedside →</button></div>`}
function bedScreen(s,m){const st=me(s,m.id),inj=medIsInj(m),im=medIM(m),exp=expected(m,s);let showTech=st.decision==='give'&&st.status==='pending';return `<div class="screenTitle">03 · Patient bedside</div><p class="muted smallText">Communicate with the patient, request findings, and verbalize why this dose can be given or should be held.</p>${patientCard(s)}<div class="groupTitle">Shared bedside verification</div><div class="actionsGrid">${stepBtn(s.global,'hygiene3','Wash hands at bedside')}${stepBtn(s.global,'introduce','Introduce yourself')}${stepBtn(s.global,'patientName','Ask patient to state name')}${stepBtn(s.global,'patientDOB','Ask patient to state DOB')}${stepBtn(s.global,'band','Compare armband with chart')}${stepBtn(s.global,'allergies','Verify drug allergies')}</div><div class="groupTitle">Instructor assessment for ${esc(m.name)}</div>${st.assessed?`<div class="infoTile"><div class="kicker">Findings disclosed by instructor</div><div style="margin-top:7px;line-height:1.65;font-size:13px">${esc(assessments[m.name]?.[isRisk(s,m)?1:0]||'Vitals reviewed, no immediate contraindications found in this fictional case.')}</div></div>`:`<button class="btn" data-act="assess">Ask proctor for appropriate assessment findings</button>`}${m.name==='Regular insulin U100'&&st.assessed?`<div class="alertLine">${esc(exp.label)}</div>`:''}${m.name==='NPH insulin U100'&&!st.clarified?`<div class="alertLine bad">An actual NPH dose was not specified in the supplied practice eMAR. Request clarification before administering.</div><button class="btn warn" data-act="clarify">Ask instructor to clarify NPH order</button>`:''}<div class="groupTitle">Administration judgment</div><div class="row wrap"><button class="btn ${st.decision==='give'?'primary':''}" data-act="decision" data-value="give">Safe to give</button><button class="btn ${st.decision==='hold'?'warn':''}" data-act="decision" data-value="hold">Hold and report</button></div>${st.decision==='hold'&&st.status==='pending'?`<div class="field"><label>Rationale / note to instructor</label><textarea data-input="notes" rows="2" placeholder="State the findings and concern">${esc(st.notes)}</textarea></div><button class="btn primary" data-act="confirmHold">Record safe hold</button>`:''}<div class="groupTitle">Third medication check</div>${rightsUI(st,'r3')}${st.status==='pending'&&st.decision==='give'?(!inj?`<div class="groupTitle">Oral administration</div><div class="actionsGrid">${stepBtn(st.done,'swallow','Assess ability to swallow')}${stepBtn(st.done,'hob','Elevate head of bed')}${stepBtn(st.done,'oralChoice','Ask pill taking preference')}${stepBtn(st.done,'teach','Explain medication')}</div><button class="btn primary" style="margin-top:13px;width:100%" data-act="administer">Administer oral medication</button>`:`<div class="groupTitle">Injection technique · ${im?'Intramuscular':'Subcutaneous'}</div><div class="actionsGrid">${stepBtn(st.done,'teach','Explain procedure and medication')}${stepBtn(st.done,'syringeVerify','Instructor verifies syringe dose')}${stepBtn(st.done,'landmarks',im?'Identify deltoid, vastus lateralis, V/G':'Identify arms, abdomen, thighs')}${stepBtn(st.done,'preference','Ask patient site preference')}</div><div class="field"><label>Chosen injection site</label><select data-input="site"><option value="">Select site</option>${(im?['Deltoid','Vastus lateralis','Ventrogluteal']:['Abdomen','Outer upper arm','Anterior thigh']).map(x=>`<option ${st.site===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="actionsGrid">${stepBtn(st.done,'gloves','Put on gloves')}${stepBtn(st.done,'wipeOpen','Open wipe and loosen cover')}${stepBtn(st.done,'siteClean','Clean site outward; do not touch')}${stepBtn(st.done,im?'ztrack':'bunch',im?'Apply Z track from side':'Bunch and hold tissue')}${stepBtn(st.done,'warnPoke','Warn patient about poke')}${stepBtn(st.done,'angle',im?'Insert at 90 degrees':'State 90 degrees or 45 if thin')}</div><div class="alertLine">${s.mode==='practice'?'Check your prepared syringe, the ordered amount, and the chosen site before injecting.':''} Selected ${esc(st.site||'no site')} · ${esc(st.syringe||'no syringe')} · ${esc(st.amount||'no amount')} ${exp.unit}</div><button class="btn primary" data-act="administer" style="width:100%">Administer simulated injection</button>`):''}${st.status==='given'&&inj?`<div class="groupTitle">After injection</div><div class="actionsGrid">${stepBtn(st.done,'hold10','Hold for 10 seconds')}${stepBtn(st.done,im?'releaseTrack':'releaseBunch',im?'Release Z track AFTER withdrawal':'Release bunch')}${stepBtn(st.done,'sharpSafe','Engage safety and sharps discard')}${stepBtn(st.done,'blot','Gently blot; do not massage')}${stepBtn(st.done,'shred','Remove label; use shred bin')}</div><button class="btn danger small" data-act="massage" style="margin-top:10px">Massage injection site (critical error)</button>`:''}${st.status==='given'&&!inj?`<span class="chip">✓ Medication given</span>`:''}${st.status==='held'?`<span class="chip orange">Dose held for safety</span>`:''}${st.status!=='pending'?`<div class="groupTitle">Complete charting</div><div class="field"><label>Administration / held documentation notes</label><textarea rows="2" data-input="notes" placeholder="Assessment, dose / reason held, response">${esc(st.notes)}</textarea></div>${stepBtn(st.done,'document','Document accurately in eMAR')}`:''}<div class="groupTitle">Final shared cleanup</div><div class="actionsGrid">${stepBtn(s.global,'trash','Dispose of appropriate trash')}${stepBtn(s.global,'hygiene4','Remove gloves if worn, wash hands')}</div><div class="actionfooter"><button class="btn primary" data-act="nextStage">Finish and grade checkoff →</button></div>`}
function dialogue(s,m){
 const recipient=s.chatTo||'patient';
 const quick=s.stage===3?[['introduce','Introduce'],['patientName','Ask name'],['patientDOB','Ask DOB'],['allergies','Ask allergies'],['swallow','Swallowing'],['oralChoice','Pill preference'],['preference','Injection site'],['water','Offer water'],['pain','Pain'],['effects','Side effects'],['teach','Explain drug']]:[];
 return `<aside class="panel rightPanel" id="conversation-panel" aria-label="Interactive simulation dialogue"><div class="splitHead"><div><div class="sectionLabel">Conversation simulator</div><h3 style="margin:0">Patient & instructor</h3></div><span class="pill">Scripted roles</span></div><div class="speakerHeader"><div class="miniSpeaker"><div class="avatar portraitSmall">${portrait('patient')}</div><span>Practice Patient</span></div><div class="miniSpeaker"><div class="avatar portraitSmall">${portrait('instructor')}</div><span>Instructor</span></div></div><div class="dialogue" id="dialogue" role="log" aria-live="polite" aria-relevant="additions" aria-label="Patient and instructor conversation">${s.dialogue.map(x=>`<div class="bubble ${esc(x.by)}"><b>${x.by==='student'?'You':x.by==='patient'?'Practice Patient':'Instructor / proctor'}</b>${esc(x.t)}</div>`).join('')}</div><form id="chat-form" class="chatComposer"><label for="chat-recipient" class="fieldLabel">Speak to</label><select id="chat-recipient" data-input="chatTo" aria-label="Choose patient or instructor"><option value="patient" ${recipient==='patient'?'selected':''} ${s.stage!==3?'disabled':''}>Practice Patient</option><option value="instructor" ${recipient==='instructor'?'selected':''}>Instructor / proctor</option></select><label for="chat-message" class="fieldLabel">Type a question or statement</label><div class="chatRow"><input id="chat-message" name="message" class="input" autocomplete="off" placeholder="${recipient==='patient'?'What is your date of birth?':'What is the apical pulse?'}" aria-label="Your question for the simulated ${esc(recipient)}"><button type="submit" class="btn primary">Send</button></div><p class="fineprint">Offline keyword matching. Try natural wording. Unrecognized questions receive a prompt to rephrase.</p></form>${quick.length?`<details class="quickPrompts"><summary>Quick phrases and conversation actions</summary><div class="dialogButtons">${quick.map(([k,v])=>`<button class="btn ghost small" type="button" data-act="speak" data-id="${k}">${v}</button>`).join('')}</div><div class="dialogButtons" style="margin-top:8px"><button class="btn ghost small" data-act="assess">Ask for vitals</button><button class="btn ghost small" data-act="clarify">Clarify order</button><button class="btn ghost small" data-act="reassess">Reassess after medication</button></div></details>`:`<div class="dialogButtons"><button class="btn ghost small" data-act="clarify">Clarify an order</button></div>`}<p class="fineprint">Both characters are fictional. The instructor provides programmed findings, not real clinical advice.</p></aside>`;
}
function simulation(){const s=current.session,m=s.c.meds.find(x=>x.id===s.active)||s.c.meds[0];const total=s.c.meds.length;const count=s.stage===1?all(s).filter(x=>prepComplete(s,x)).length:s.stage===2?all(s).filter(x=>quizComplete(s,x)).length:all(s).filter(x=>medBed(s,x)).length;return `<div style="margin-bottom:19px"><div class="row between"><div><div class="eyebrow">${s.stage===1?'Medication room / independent':s.stage===2?'Medication room / instructor':'Patient room / administration'}</div><h2 style="margin:8px 0 6px">${s.stage===1?'First medication check':s.stage===2?'Second medication check':'Third medication check'}</h2></div><span class="pill">${count} / ${total} medications</span></div><div class="progress"><div class="progressFill" style="width:${100*count/total}%"></div></div></div><div class="workspace ${s.stage===1?'prepWorkspace':''}">${sidebar(s)}<main class="panel">${s.stage===1?prepScreen(s,m):s.stage===2?instructorScreen(s,m):bedScreen(s,m)}<div class="divider"></div><div class="fineprint">Training tool based on the supplied course checklists. It is not an actual prescribing, dose verification, or clinical administration system.</div></main>${dialogue(s,m)}</div>`}
function report(){let s=current.session,res=s.summary||{};let possible=s.c.meds.flatMap(m=>{let st=me(s,m.id);let missing=[];if(!prepComplete(s,m))missing.push('First check incomplete');if(!quizComplete(s,m))missing.push('Second check incomplete');if(!medBed(s,m))missing.push('Third check or documentation incomplete');if(medIsInj(m)&&st.status==='given'&&!hasAll(st.done,['hold10',medIM(m)?'releaseTrack':'releaseBunch','sharpSafe','blot','shred']))missing.push('Post injection steps incomplete');return missing.map(t=>m.name+': '+t)});let overall=res.result||'UNSATISFACTORY';return `<div class="panel" style="max-width:950px;margin:auto"><div class="eyebrow">Simulated skills evaluation</div><h2>Medication pass report</h2><div class="grid2" style="align-items:center"><div><div class="score ${overall==='SATISFACTORY'?'good':'bad'}">${overall==='SATISFACTORY'?'S':'U'}</div><h2>${overall}</h2><p class="muted">This is app feedback, not an official faculty grade.</p></div><div class="stack"><div class="infoTile"><span class="kicker">Scenario</span><b>${esc(getCase(s.caseKey).label)}</b></div><div class="infoTile"><span class="kicker">Time used</span><b>${formatTime(s.elapsed)} / 30:00</b></div><div class="infoTile"><span class="kicker">Mode</span><b>${esc(s.mode==='practice'?'Coached practice':'Checkoff')} ${s.challenge?'· Safety challenge':''}</b></div></div></div>${s.critical.length?`<div class="groupTitle">Critical safety errors</div>${s.critical.map(x=>`<div class="critical">${esc(x)}</div>`).join('')}`:''}${s.mistakes.length?`<div class="groupTitle">Knowledge corrections</div>${s.mistakes.map(x=>`<div class="alertLine">${esc(x)}</div>`).join('')}`:''}${possible.length?`<div class="groupTitle">Outstanding procedural elements</div>${possible.map(x=>`<p class="smallText">• ${esc(x)}</p>`).join('')}`:`<p class="chip">✓ No incomplete medication section detected</p>`}<div class="groupTitle">Medication outcomes</div>${s.c.meds.map(m=>{const st=me(s,m.id);return `<div class="reportRow"><b>${esc(st.status.toUpperCase())}</b><span>${esc(m.name)}</span><span>${st.done.has('document')?'Documented':'Not documented'}</span></div>`}).join('')}<div class="groupTitle">Patient and instructor responses</div><div class="transcriptReport">${s.dialogue.slice(-12).map(x=>`<p><b>${esc(x.by==='student'?'You':x.by==='patient'?'Practice Patient':'Instructor')}:</b> ${esc(x.t)}</p>`).join('')}</div><div class="groupTitle">Timestamped action log</div><div style="max-height:350px;overflow:auto">${s.events.map(ev=>`<div class="reportRow"><b>${formatTime(ev.at*1000)}</b><span>${esc(ev.name)}</span><span class="muted">${esc(ev.detail||'')}</span></div>`).join('')}</div><div class="actionfooter"><button class="btn ghost" data-act="reportJson">Export JSON log</button><button class="btn ghost" data-act="print">Print report</button><button class="btn primary" data-act="restart">New practice attempt</button></div></div>`}
function library(){let items=Object.entries(REF);return `<div class="eyebrow" style="margin-top:19px">Medication reference</div><h2>Study the drug before the pass.</h2><p class="lead" style="font-size:14px">Based primarily on your completed medication sheet. The additional aspirin, ibuprofen, acetaminophen and lab saline entries support the eMAR workbook. Patient specific parameters remain unspecified until supplied in a scenario.</p><div class="libraryCards">${items.map(([name,r])=>`<div class="libraryCard"><div class="kicker">${esc(r.cl)}</div><h3>${esc(name)}</h3><p><b style="color:#eef8f8">${esc(r.trade)}</b><br>${esc(r.why)}</p><p><b style="color:#afeee0">Assess:</b> ${esc(r.assess)}</p><p><b style="color:#ffd0ab">Watch:</b> ${esc(r.adverse)}</p><p><b style="color:#afeee0">Teach:</b> ${esc(r.teach)}</p></div>`).join('')}</div>`}
function about(){return `<div class="panel" style="max-width:850px;margin:18px auto"><div class="eyebrow">How to use it</div><h2>Three checks. One 30 minute window.</h2><p class="lead" style="font-size:14px">The simulation follows the student provided PO, Subcutaneous, and IM checkoff rubrics. Click an eMAR medication to work on it. Complete all three orders in the room, advance to the instructor, answer each question, then interact with the patient.</p><div class="grid3"><div class="infoTile"><div class="kicker">01</div><b>Prepare</b><p class="smallText muted">Hand hygiene, allergies, expiration, six rights, measured doses, vial preparation, syringe labels.</p></div><div class="infoTile"><div class="kicker">02</div><b>Verify</b><p class="smallText muted">Second six rights, medication questions, hand hygiene before moving.</p></div><div class="infoTile"><div class="kicker">03</div><b>Administer</b><p class="smallText muted">Two identifiers, bedside checks, vitals from proctor, oral or injection steps, charting.</p></div></div><div class="groupTitle">Source handling and important limitations</div><p class="sourceNote"><strong>Publication permission:</strong> the app requester reports confirmation from their instructor and college that these adapted course workbook and checkoff materials may be shared publicly. This permission was reported by the requester and has not been independently reviewed by the app developer. No real patient information is present.</p><p class="sourceNote">The course list uses the name Fluzone Quadrivalent, but the 2026 to 2027 US formulation is trivalent Fluzone. Review the exact vial labeling before any real clinical use.</p><p class="sourceNote">All 20 simulation cases use the obviously fictional name Practice Patient, birth date 01/01/1950, and location Sim Bed 1. The workbook does not provide an insulin correction scale or a patient specific NPH dose. Regular insulin uses a clearly labeled fictional scale. NPH requires clarification in workbook cases; the instructor supplies a fictional 12 unit practice order. Synthetic drug drills are not part of the uploaded workbook.</p><p class="sourceNote">The three rubrics describe required procedural steps and a 30 minute time limit. The app also applies educational instant failure gates chosen for this practice simulation; these are NOT necessarily your program’s official grading rules. The privately supplied forms contain inconsistent peer signature wording (upper checklists say different days; signature section says same day), so this app simply asks you to confirm signoffs rather than choosing a rule.</p><p class="sourceNote">The uploaded lab slides specify injection vial actions that depend on vial type, while a checkoff checklist gives a common inject equal air step. This app follows the skill sheet workflow and does not replace vial specific manufacturer instructions or site policy. Certain simulation orders, notably 18 mg IM normal saline, are not ordinary clinical orders. Always clarify actual orders.</p><div class="actionfooter"><button class="btn primary" data-act="goHome">Return to setup</button></div></div>`}
function main(){let html=`<div class="shell">${nav()}${current.view==='home'?'':tabs()}${current.notice?`<div class="notice ${esc(current.noticeKind)}" role="status">${esc(current.notice)}</div>`:''}${current.view==='home'?home():current.tab==='library'?library():current.tab==='about'?about():current.session?.stage===4?report():simulation()}<div class="foot">MedPass Lab · Offline practice app · Educational simulation only · No real patient information · Verify your school policy and medication orders.</div></div><div id="toast" class="toast hide" aria-live="polite"></div>`;el.innerHTML=html;const d=document.querySelector('#dialogue');if(d)d.scrollTop=d.scrollHeight;const session=current.session;const announcer=document.getElementById('dialogue-announcement');if(announcer&&session&&current.view==='run'&&current.tab==='workspace'&&session.stage!==4){const pending=session.dialogue.filter(item=>item.seq>(session.announcedSeq||0));if(pending.length){announcer.textContent=pending.map(item=>(item.by==='student'?'You':item.by==='patient'?'Practice Patient':'Instructor')+': '+item.t).join(' ');session.announcedSeq=session.saySequence;}}}
function render(){if(!current.session)current.view='home';main()}
function clickStep(id){const s=current.session,m=s.c.meds.find(x=>x.id===s.active),st=me(s,m.id),inj=medIsInj(m);let shared=['uniform','peers','hygiene1','marAllergies','hygiene2','hygiene3','introduce','patientName','patientDOB','band','allergies','trash','hygiene4'];
 if(shared.includes(id)){
  if(id==='band'&&(!s.global.has('patientName')||!s.global.has('patientDOB'))){notify('Ask the patient to state both identifiers before matching armband and chart.','warn');return}
  if(id==='hygiene4'&&s.c.meds.some(x=>me(s,x.id).status==='pending')){notify('Complete medication administration or a safe hold before final cleanup.','warn');return}
  mark(id);if(id==='introduce'){say(s,'student','Hello, I am your student nurse. I will explain the medications due now.');say(s,'patient','Hello. Thanks for introducing yourself.');}if(id==='patientName')say(s,'patient','My name is Practice Patient.');if(id==='patientDOB')say(s,'patient','January 1, 1950.');if(id==='allergies')say(s,'patient','I have no known drug allergies.');if(['introduce','patientName','patientDOB','allergies'].includes(id))render();return
 }
 if(id.startsWith('r1_')||id.startsWith('r2_')||id.startsWith('r3_')){
  if(id.startsWith('r1_')&&!s.global.has('marAllergies')){notify('First locate the MAR and review allergies.','warn');return}
  if(id.startsWith('r3_')&&!s.global.has('band')){notify('Verify the two patient identifiers and wristband before your bedside medication rights check.','warn');return}
  mark(id,m);return
 }
 if(s.stage===1){
  if(['gather','expiry','keepPackaged'].includes(id)){if(!s.global.has('hygiene1')){notify('Wash hands before gathering drugs.','warn');return}if(id==='keepPackaged'&&!st.done.has('gather')){notify('Gather the correct package first.','warn');return}mark(id,m);return}
  if(!st.done.has('gather')||!st.done.has('expiry')||!rightsComplete(st,'r1')){notify('Verify the label, expiry, and first six rights before preparing this injection.','warn');return}
  if(id==='chooseSyringe'){if(!st.syringe){notify('Choose a syringe first.','warn');return}mark(id,m);return}
  if(id==='labelWritten'){if(st.amount===''||!Number.isFinite(Number(st.amount))||Number(st.amount)<=0){notify('Enter the planned draw amount before preparing the syringe label.','warn');return}if(!(s.initials||'').trim()||!(s.credentials||'').trim()){notify('Add your initials and credentials to the medication label.','warn');return}mark(id,m);return}
  if(id==='rollNPH'){mark(id,m);return}
  if(id==='oralCount'){if(st.amount===''||!Number.isFinite(Number(st.amount))||Number(st.amount)<=0){notify('Enter the calculated number of tablets before confirming.','warn');return}mark(id,m);return}
  if(id==='vialClean'){if(!st.done.has('chooseSyringe')){notify('Select the syringe first.','warn');return}mark(id,m);return}
  if(id==='injectAir'){if(!st.done.has('vialClean')){notify('First cleanse the vial top.','warn');return}if(st.air===''||Math.abs(Number(st.air)-expected(m,s).volume)>.0001){notify('Air volume must equal the intended withdrawal volume in this simulation. Recheck units and mL.','warn');return}}
  if(id==='withdraw'){
   if(!st.done.has('injectAir')){notify('Complete the vial preparation steps first.','warn');return}
   if(m.name==='NPH insulin U100'&&!st.clarified){notify('The NPH order is incomplete. Request instructor clarification before drawing.','warn');return}
   if(m.name==='NPH insulin U100'&&!st.done.has('rollNPH')){notify('Gently roll the NPH vial before drawing.','warn');return}
   if(st.amount===''||!Number.isFinite(Number(st.amount))||Number(st.amount)<=0){notify('Enter the amount actually withdrawn.','warn');return}
  }
  if(id==='labelAttached'&&(!st.done.has('labelWritten')||!st.done.has('withdraw'))){notify('Complete the syringe label and withdrawal first.','warn');return}
  if(id==='clearBubbles'&&!st.done.has('withdraw')){notify('Withdraw the medication first.','warn');return}
  if(id==='sterile'&&!st.done.has('withdraw')){notify('Withdraw the medication first.','warn');return}
  mark(id,m);return
 }
 if(s.stage===3){
  if(['swallow','oralChoice','preference','teach','water','pain','feel','effects'].includes(id)){speak(id);return}
  if(id==='hob'){if(!st.done.has('swallow')){notify('Assess swallowing first.','warn');return}mark(id,m);return}

  if(id==='landmarks'){mark(id,m);say(s,'student',medIM(m)?'I would identify deltoid, vastus lateralis, and ventrogluteal landmarks.':'I would identify the outer upper arm, abdominal quadrants, and anterior thigh. Heparin belongs in the abdomen for this checkoff.');return}
  if(['gloves','wipeOpen','siteClean','bunch','ztrack','warnPoke','angle'].includes(id)){
   if(id==='gloves'&&!st.done.has('landmarks')){notify('Verbalize landmarks before beginning site preparation.','warn');return}
   if(id==='siteClean'&&!st.done.has('wipeOpen')){notify('Open an alcohol wipe before cleaning the site.','warn');return}
   if(['bunch','ztrack','angle'].includes(id)&&!st.done.has('siteClean')){notify('Clean the site before injection positioning.','warn');return}
   mark(id,m);if(id==='warnPoke')say(s,'student','You will feel a small poke.');return
  }
  if(['hold10','releaseTrack','releaseBunch','sharpSafe','blot','shred'].includes(id)){if(st.status!=='given'){notify('These are post administration steps.','warn');return}if(id==='releaseTrack'&&!st.done.has('sharpSafe')){notify('Withdraw the needle and engage safety before releasing the Z track.','warn');return}if(id==='releaseBunch'&&!st.done.has('hold10')){notify('Hold after injection before releasing the skin bunch.','warn');return}if(id==='sharpSafe'&&!st.done.has(medIM(m)?'hold10':'releaseBunch')){notify('Complete the required hold and safe needle withdrawal sequence first.','warn');return}mark(id,m);return}
  if(id==='document'){if(st.status==='pending'){notify('There is no given or held outcome to document yet.','warn');return}if(inj&&st.status==='given'&&!hasAll(st.done,['hold10',medIM(m)?'releaseTrack':'releaseBunch','sharpSafe','blot','shred'])){notify('Complete post injection safety and disposal before charting.','warn');return}mark(id,m);return}
 }
 notify('This step is not available in the current phase.','warn')
}
function speak(id){
 const s=current.session,m=s.c.meds.find(x=>x.id===s.active),st=me(s,m.id);if(s.stage!==3)return;
 if(['patientName','patientDOB','allergies','introduce'].includes(id)){clickStep(id);return}
 if(id==='swallow'){say(s,'student','Do you have difficulty swallowing pills?');say(s,'patient','No, I can swallow pills without difficulty.');mark('swallow',m)}
 else if(id==='oralChoice'){say(s,'student','Would you like your pills one at a time or together?');say(s,'patient','One at a time, please.');mark('oralChoice',m)}
 else if(id==='preference'){say(s,'student','Which injection site would you prefer?');say(s,'patient',medIM(m)?'My upper arm is okay, if it is an appropriate site.':'My abdomen is okay, if it is an appropriate site.');mark('preference',m)}
 else if(id==='teach'){say(s,'student',`I am here to give ${m.name}. ${REF[m.name]?.why||'It has been prescribed for your care'}. I'll explain what to watch for.`);say(s,'patient','What side effects should I watch for?');mark('teach',m)}
 else if(id==='water'){say(s,'student','I can offer water if it is safe for you to swallow.');if(!st.done.has('swallow')&&!s.c.meds.some(x=>me(s,x.id).done.has('swallow'))){say(s,'patient','Okay. Would you ask me about swallowing first?');}else{s.patientState.waterProvided=true;s.patientState.waterRequested=false;say(s,'patient','Thank you, that helps.');log(s,'Responded to request for water','Confirmed swallowing ability before offering water');}render()}
 else if(id==='pain'){if(!s.patientState.pain){s.patientState.pain='7/10';say(s,'patient','My pain is about seven out of ten.');}else if(s.patientState.postOpioid){say(s,'patient','My pain is improving, but I am getting sleepier.');}else{s.patientState.pain='8/10';say(s,'patient','It is actually getting worse now, about eight out of ten.');log(s,'Reported symptom change','Simulated increase in pain score; consider reassessment');}render()}
 else if(id==='feel'){say(s,'student','How are you feeling right now?');say(s,'patient',s.patientState.postOpioid?'I feel sleepier since that pain medicine.':'I am a little uncomfortable, but I am awake and can answer you.');render()}
 else if(id==='dizziness'){
  const findings=assessments[m.name]?.[isRisk(s,m)?1:0]||'';
  const response=window.MedPassDialogue.dizzinessResponse(findings,s.patientState.dizziness);
  s.patientState.dizziness=response.dizziness;
  say(s,'patient',response.text);
  log(s,'Patient answered dizziness assessment',m.name+' | dizziness: '+response.dizziness);
  render();
 }
 else if(id==='effects'){say(s,'student',`A possible concern with ${m.name} is ${REF[m.name]?.adverse||'an adverse reaction'}. Tell me if you experience new symptoms.`);say(s,'patient','Which symptoms would mean I should call for help right away?');render()}
}
function assess(){
 const s=current.session,m=s.c.meds.find(x=>x.id===s.active),st=me(s,m.id);
 if(s.stage!==3){notify('Physical assessment questions are part of the bedside check.','warn');return}
 st.assessed=true;log(s,'Asked instructor for clinical assessment',m.name);
 say(s,'student',`What assessment findings should I review before giving ${m.name}?`);
 say(s,'instructor',assessments[m.name]?.[isRisk(s,m)?1:0]||'Assessment findings are satisfactory in this fictional scenario.');
 updateVitals(s,m);render();
}
function clarify(){const s=current.session,m=s.c.meds.find(x=>x.id===s.active),st=me(s,m.id);if(m.name!=='NPH insulin U100'){say(s,'instructor','Review the written order and request clarification for any discrepancy.');render();return}st.clarified=true;log(s,'Order clarification received','Fictional practice NPH: 12 units SC once');say(s,'student','The MAR lists NPH per sliding scale without the NPH order or dose. Please clarify.');say(s,'instructor','For this TRAINING exercise only, the clarified order is NPH 12 units SC now. The real MAR would require an authorized order.');render()}
function decision(v){const s=current.session,m=s.c.meds.find(x=>x.id===s.active),st=me(s,m.id);if(!st.assessed){notify('Ask the instructor for physical assessment findings before making a decision.','warn');return}st.decision=v;log(s,'Medication decision',m.name+' : '+v);render()}
function confirmHold(){const s=current.session,m=s.c.meds.find(x=>x.id===s.active),st=me(s,m.id);if(st.decision!=='hold')return;if(!st.assessed){notify('Request relevant physical assessment first.','warn');return}if(!isRisk(s,m)&&m.name!=='Simulation sodium chloride'&&!(m.name==='NPH insulin U100'&&!st.clarified)){notify('Findings in this case do not clearly support holding. Discuss with the instructor or switch to safety challenge.','warn');return}if(!s.global.has('band')||!rightsComplete(st,'r3')){notify('Complete bedside identity and the third six rights even when withholding medication.','warn');return}st.status='held';log(s,'Dose held',m.name+' : '+(st.notes||'Concerning findings reported'));say(s,'instructor','You identified a reason not to administer. Document the findings, notify the appropriate clinician, and follow local policy.');render()}
function administer(){const s=current.session,m=s.c.meds.find(x=>x.id===s.active),st=me(s,m.id),inj=medIsInj(m),e=expected(m,s);
 if(!s.global.has('band')||!s.global.has('patientName')||!s.global.has('patientDOB')){say(s,'patient','Before you give that, should you check the name and birth date on my wristband?');fail('Medication administration attempted without verifying two identifiers against the armband.');return}
 if(!st.assessed||isRisk(s,m)||st.decision!=='give'){
  if(isRisk(s,m)||!st.assessed){fail('Medication administered without a verified safe clinical assessment, or despite a contraindication.');return}
  notify('First verbalize that it is safe to give, based on the assessment.','warn');return
 }
 if(m.name==='NPH insulin U100'&&!st.clarified){fail('NPH administered without a complete clarified order.');return}
 if(inj){
  if(st.syringe!==anticipatedSyringe(m,s)){fail('Incorrect syringe selection for the calculated dose and formulation.');return}
  if(medIM(m)&&!['1 inch','1.5 inch'].includes(st.needle)){fail('Incorrect IM needle length for the fictional average adult training model.');return}
  if(st.amount===''||!Number.isFinite(Number(st.amount))||Math.abs(Number(st.amount)-e.value)>.0001){fail('Incorrect injection dose or volume. Expected '+e.value+' '+e.unit+' in this fictional case.');return}
  if(!st.site){notify('Choose a site after asking the patient for a preference.','warn');return}
  if(m.name==='Heparin'&&st.site!=='Abdomen'){fail('Heparin was injected outside the abdominal area required by the supplied checkoff.');return}
  if(medIM(m)&&!['Deltoid','Vastus lateralis','Ventrogluteal'].includes(st.site)){fail('Invalid intramuscular site.');return}
  if(!medIM(m)&&!['Abdomen','Outer upper arm','Anterior thigh'].includes(st.site)){fail('Invalid subcutaneous site.');return}
 }else{
  if(!st.done.has('keepPackaged')){notify('Oral medications should remain in packaging during preparation.','warn');return}
  if(st.amount===''||!Number.isFinite(Number(st.amount))||Math.abs(Number(st.amount)-e.value)>.0001){fail('Incorrect oral tablet or capsule count for the ordered dose.');return}
  if(!st.done.has('swallow')){notify('Assess swallowing first.','warn');return}
 }
 if(!rightsComplete(st,'r3')||!st.done.has('teach')){notify('Complete the third six rights check and medication explanation.','warn');return}
 if(inj){let required=['syringeVerify','landmarks','preference','gloves','wipeOpen','siteClean',medIM(m)?'ztrack':'bunch','warnPoke','angle'];if(!hasAll(st.done,required)){notify('Complete the injection preparation, landmarks, patient preference, and technique steps first.','warn');return}}
 else if(!hasAll(st.done,['hob','oralChoice'])){notify('Elevate the head of bed and ask how the patient prefers to take tablets.','warn');return}
 st.status='given';log(s,'Administered simulated medication',m.name+' '+m.order+(inj?' / '+st.site:' / oral'));say(s,'patient',inj?'Okay, the injection is finished.':'Thank you. I have taken the medication.');if(m.name==='Oxycodone/acetaminophen'){s.patientState.postOpioid=true;s.patientState.alertness='Reports new drowsiness';s.patientState.rr=null;s.patientState.spo2=null;s.patientState.note='Patient reports increased sleepiness after simulated opioid. Reassess RR, SpO₂, sedation and pain.';say(s,'patient','I think my pain is easing, but I feel a little sleepier now. Is that normal?');log(s,'Change in patient condition','Reports drowsiness after simulated opioid; reassessment indicated');}else if(m.name==='Docusate sodium'){say(s,'patient','Would you let me know when it is supposed to help?');}render()
}
function answerQuiz(index){const s=current.session,m=s.c.meds.find(x=>x.id===s.active),st=me(s,m.id),q=REF[m.name]?.q;let correct=q?.[2]??0;st.quizAttempts++;
 if(index===correct){st.quiz=true;log(s,'Instructor knowledge question answered correctly',m.name);say(s,'instructor','Correct. Proceed with your verification.');render()}
 else{s.mistakes.push(m.name+': incorrect pharmacology answer (attempt '+st.quizAttempts+').');log(s,'Incorrect pharmacology response',m.name);say(s,'instructor','Not quite. Reconsider which assessment or safety principle matters most.');notify('Incorrect answer. Review the drug reference and try again.','warn')}}
function downloadReport(){let s=current.session;if(!s)return;let serial={case:s.caseKey,mode:s.mode,challenge:s.challenge,outcome:s.summary?.result,elapsedSeconds:Math.floor(s.elapsed/1000),criticalErrors:s.critical,mistakes:s.mistakes,medications:s.c.meds.map(m=>({name:m.name,order:m.order,status:me(s,m.id).status,steps:[...me(s,m.id).done],notes:me(s,m.id).notes})),sharedSteps:[...s.global],eventLog:s.events};const blob=new Blob([JSON.stringify(serial,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='medpass_checkoff_report.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function inputHandler(e){let n=e.target.dataset.input;if(!n)return;let s=current.session,st=s?me(s,s.active):null;if(n==='case'){current.caseKey=e.target.value;render()}else if(n==='mode')current.mode=e.target.value;else if(n==='challenge')current.challenge=e.target.checked;else if(st&&n==='syringe')st.syringe=e.target.value;else if(st&&n==='needle')st.needle=e.target.value;else if(st&&n==='amount')st.amount=e.target.value;else if(st&&n==='air')st.air=e.target.value;else if(st&&n==='site')st.site=e.target.value;else if(s&&n==='initials')s.initials=e.target.value;else if(s&&n==='credentials')s.credentials=e.target.value;else if(st&&n==='notes')st.notes=e.target.value;else if(s&&n==='chatTo')s.chatTo=e.target.value}
function typedDialogue(role,text){
 const s=current.session;if(!s||s.ended)return;
 const cleaned=String(text||'').trim().slice(0,500);if(!cleaned)return;
 const m=s.c.meds.find(x=>x.id===s.active),intent=window.MedPassDialogue.match(role,s.stage,cleaned,MEDICATION_VOCABULARY);
 say(s,'student',cleaned);log(s,'Student spoke to '+role,cleaned);
 if(role==='instructor'){
   if(intent==='assess'){assess();return}
   if(intent==='clarify'){clarify();return}
   const info=REF[m.name]||{};
   if(intent==='mechanism'){const mechanisms={'Diltiazem':'Blocks cardiac and vascular L type calcium channels, reducing AV nodal conduction and heart rate.','Furosemide':'Blocks the Na K 2Cl cotransporter in the thick ascending limb of the loop of Henle.','Heparin':'Potentiates antithrombin, inhibiting clotting factors including thrombin and factor Xa.','Regular insulin U100':'Promotes cellular glucose uptake and suppresses hepatic glucose production.','NPH insulin U100':'Provides intermediate duration insulin effect by delaying absorption.','Warfarin':'Inhibits vitamin K epoxide reductase, reducing activation of vitamin K dependent clotting factors.','Oxycodone/acetaminophen':'Oxycodone activates opioid receptors; acetaminophen produces central analgesic and antipyretic effects.'};say(s,'instructor',mechanisms[m.name]||`${m.name} belongs to the ${info.cl||'listed'} class. Review the full pharmacology reference for the precise mechanism.`)}
   else if(intent==='adverse')say(s,'instructor',`For ${m.name}, watch for ${info.adverse||'drug specific adverse effects and contraindications'}. Which assessment will you check?`);
   else if(intent==='dose'){say(s,'instructor',s.mode==='practice'?`Training calculation: ${expected(m,s).label}`:'For this checkoff, use the eMAR and labeled product to explain your calculated amount. I will verify your syringe during the required step.');}
   else if(intent==='indication')say(s,'instructor',`The training indication for ${m.name}: ${info.why||'review the prescription and assigned diagnosis'}.`);
   else {const reply=window.MedPassDialogue.fallback(role);say(s,reply.by,reply.text);}
   render();return;
 }
 if(intent==='wrongName'){say(s,'patient','No, that is not my name. I am Practice Patient. Please ask me to state my name and compare my wristband with the MAR.');log(s,'Patient corrected mismatched identifier',cleaned);render();return}
 if(intent==='name'){speak('patientName');if(/(?:date of birth|dob|birth date)/i.test(cleaned))speak('patientDOB');return}
 if(intent==='dob'){speak('patientDOB');return}
 if(intent==='allergies'){speak('allergies');return}
 if(intent==='medications'){
   say(s,'patient',window.MedPassDialogue.medicationReply(s.c.meds,cleaned,REF));
   log(s,'Patient answered medication history question','Medication history uncertain; verify with instructor and MAR');
   render();return;
 }
 if(intent==='band'){say(s,'patient','Yes, please check my wristband against the record.');render();return}
 if(intent==='introduce'){speak('introduce');return}
 if(['swallow','oralChoice','preference','water','pain','feel','dizziness','effects','teach'].includes(intent)){speak(intent);return}
 if(intent==='notbedside'){say(s,'instructor','The patient is not available until the bedside phase.');render();return}
 const reply=window.MedPassDialogue.fallback(role);say(s,reply.by,reply.text);render();
}
el.addEventListener('submit',e=>{if(e.target.id!=='chat-form')return;e.preventDefault();const message=e.target.querySelector('[name="message"]');const text=message?.value||'';const s=current.session;if(!s)return;typedDialogue(s.chatTo||'instructor',text)});
el.addEventListener('change',inputHandler);el.addEventListener('input',e=>{if(['notes','amount','air','initials','credentials'].includes(e.target.dataset.input))inputHandler(e)});
el.addEventListener('click',e=>{const button=e.target.closest('[data-act]');if(!button)return;let a=button.dataset.act,id=button.dataset.id,s=current.session;
 if(a==='start'){launch();return}if(a==='goHome'){current.view='home';current.tab='workspace';current.session=null;render();return}
 if(a==='tab'){current.tab=id;render();return}if(a==='restart'){current.session=null;current.view='home';current.tab='workspace';render();return}
 if(a==='selectMed'&&s){s.active=id;current.notice='';render();return}if(a==='prepView'&&s){s.prepLayout=button.dataset.value==='all'?'all':'guided';current.notice='';render();return}if(a==='nextMed'&&s){const next=s.c.meds.find(m=>!prepComplete(s,m));if(next){s.active=next.id;current.notice='';render();}return}if(a==='step'&&s){clickStep(id);return}if(a==='nextStage'&&s){stageAdvance();return}
 if(a==='speak'&&s){speak(id);return}if(a==='assess'&&s){assess();return}if(a==='clarify'&&s){clarify();return}if(a==='decision'&&s){decision(button.dataset.value);return}
 if(a==='confirmHold'&&s){confirmHold();return}if(a==='administer'&&s){administer();return}if(a==='answerQuiz'&&s){answerQuiz(Number(button.dataset.index));return}
 if(a==='reassess'&&s){reassessPatient();return}
 if(a==='massage'&&s){fail('Massaging the injection site after administration or as an injection technique.');return}
 if(a==='end'&&s){log(s,'Session ended by student');finish();return}
 if(a==='reportJson'){downloadReport();return}if(a==='print'){window.print();return}
});
el.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset.act==='selectMed'){e.preventDefault();e.target.click()}});
if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{});
setInterval(tick,1000);render();
})();
